name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this workflow only reads the repository. Without it the
# jobs inherit the repository's default token scope, which may be read/write.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Lint and format check (Biome)
        run: npm run check
      - name: n8n structural lint (ESLint)
        run: npm run lint:n8n
